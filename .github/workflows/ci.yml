name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  matlab-smoke:
    name: MATLAB Smoke Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Validate entry points and critical modules
        uses: matlab-actions/run-command@v2
        with:
          command: |
            restoredefaultpath;
            addpath(genpath(pwd));

            entryPoints = { ...
              'SNAP', 'SNAP_batch', 'SNAP_prepare', ...
              'SNAP_classify', 'SNAP_train' ...
            };
            for i = 1:numel(entryPoints)
                f = entryPoints{i};
                assert(~isempty(which(f)), "Missing entry point: " + f);
                fh = str2func(f); %#ok<NASGU>
            end

            criticalFns = { ...
              'snap_helpers.exportChannelDataStandardized', ...
              'snap_helpers.exportNucleiSignalDataStandardized', ...
              'snap_helpers.computeSignalMeasurements', ...
              'snap_helpers.classification.buildFeatureMatrix', ...
              'snap_helpers.classification.normalizeExpressionPack', ...
              'snap_helpers.classification.validateExpressionPackAgainstCapabilities', ...
              'snap_contrib.svm.lintExpressionPack', ...
              'snap_modules.signal.runPipeline' ...
            };
            for i = 1:numel(criticalFns)
                f = criticalFns{i};
                assert(~isempty(which(f)), "Missing core function: " + f);
                fh = str2func(f); %#ok<NASGU>
            end

            disp('SNAP MATLAB smoke checks passed.');

      - name: Run tests if present
        uses: matlab-actions/run-command@v2
        with:
          command: |
            if isfolder('tests')
                results = runtests('tests', 'IncludeSubfolders', true);
                assertSuccess(results);
            else
                disp('No tests/ directory found. Skipping runtests.');
            end

      - name: Lint expression-pack schema and compatibility
        uses: matlab-actions/run-command@v2
        with:
          command: |
            restoredefaultpath;
            addpath(genpath(pwd));

            params = struct();
            params.numChannels = 1;
            params.gaussFitMethod = {'3D Gaussian'};
            params.maximaMode = {'3D'};
            params.preProcMode = {'3D'};

            pack = snap_contrib.svm.buildExpressionPack('ParameterStruct', params, 'Channels', 1);
            lintReport = snap_contrib.svm.lintExpressionPack(pack, ...
                'ParameterStruct', params, ...
                'Mode', 'strict', ...
                'AutoGuardUnsafeExpressions', false, ...
                'Verbose', false);
            assert(lintReport.success, 'Expression-pack lint failed.');

            tmpPackPath = fullfile(tempdir, 'snap_ci_expression_pack.mat');
            snap_contrib.svm.saveExpressionPack(pack, tmpPackPath);
            lintReportFile = snap_contrib.svm.lintExpressionPack(tmpPackPath, ...
                'ParameterStruct', params, ...
                'Mode', 'strict', ...
                'AutoGuardUnsafeExpressions', false, ...
                'Verbose', false);
            assert(lintReportFile.success, 'Expression-pack lint failed for MAT file.');

            disp('Expression-pack lint checks passed.');
