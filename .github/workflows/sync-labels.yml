name: Sync Repository Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-labels.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labeler.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              { name: "core", color: "b60205", description: "Touches SNAP core runtime paths" },
              { name: "contribution", color: "0e8a16", description: "Non-core extension or community add-on" },
              { name: "docs", color: "1d76db", description: "Documentation changes" },
              { name: "governance", color: "5319e7", description: "Repo process, templates, or policy" },
              { name: "bug", color: "d73a4a", description: "Confirmed or suspected bug" },
              { name: "needs-repro", color: "fbca04", description: "Needs reproducible example/logs" },
              { name: "enhancement", color: "a2eeef", description: "Feature or improvement request" }
            ];

            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100
            });
            const existingMap = new Map(existing.map(l => [l.name.toLowerCase(), l]));

            for (const label of required) {
              const hit = existingMap.get(label.name.toLowerCase());
              if (!hit) {
                core.info(`Creating label: ${label.name}`);
                await github.rest.issues.createLabel({ owner, repo, ...label });
                continue;
              }

              const needsUpdate =
                hit.color.toLowerCase() !== label.color.toLowerCase() ||
                (hit.description || "") !== label.description;

              if (needsUpdate) {
                core.info(`Updating label: ${label.name}`);
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: hit.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }
